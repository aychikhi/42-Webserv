
name: Auto Sync Fork

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync with original repository
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          case "$GITHUB_REPOSITORY" in
            aychikhi/42-Webserv)
              UPSTREAM="https://github.com/ssbaytri/Webserv.git"
              ;;
            aychikhi/ft_transcendence)
              UPSTREAM="https://github.com/ssbaytri/ft_transcendence.git"
              ;;
            *)
              echo "Unknown repository: $GITHUB_REPOSITORY"
              exit 1
              ;;
          esac

          git remote add upstream "$UPSTREAM"
          git fetch upstream main

          if ! git merge upstream/main --no-edit; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)

            if [[ ${#conflicts[@]} -ne 1 || "${conflicts[0]}" != ".github/workflows/sync.yml" ]]; then
              echo "Merge conflict requires manual resolution"
              exit 1
            fi

            git checkout --ours -- .github/workflows/sync.yml
            git add .github/workflows/sync.yml
            git commit -m "Sync upstream, keep fork workflow"
          fi

          git push origin main
